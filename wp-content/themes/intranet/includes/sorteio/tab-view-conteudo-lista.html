<div class="conteudo-lista" data-data="{ATRIBUTO-DATA}" data-tipo="{ATRIBUTO-TIPO}">
    <div class="row fixar-btn">
        <div class="col accordion-buttons">
            <div class="text-right">
                <button data-data="{ATRIBUTO-DATA}" class="btn btn-notificar-sorteados {OCULTAR-BOTAO}" disabled>
                    <i class="fa fa-envelope" aria-hidden="true"></i> Confirmar Presença 
                </button>
                <button data-data="{ATRIBUTO-DATA}" class="btn btn-enviar-instrucoes" data-toggle="modal" data-target="#modal_{ATRIBUTO-DATA-CONF}" data-postid="{POST-ID}" data-responsavel="{RESPONSAVEL}">
                    <i class="fa fa-envelope-open" aria-hidden="true"></i> Enviar Instruções 
                </button>
                <div class="text-secondary mt-2 count-selecionados d-none"><strong>0 Selecionados</strong></div>
            </div>

            <div class="modal fade" id="modal_{ATRIBUTO-DATA-CONF}" data-data="{ATRIBUTO-DATA-CONF}" tabindex="-1" role="dialog" aria-labelledby="modal_{ATRIBUTO-DATA-CONF}_label" aria-hidden="true">
                <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
                    <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">Enviar instruções sobre os ingressos</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">

                        <div class="editorEmail" data-name="conteudo_email" id="{EDITOR-ID}"></div>

                        <div class="form-group mt-2">
                            <label for="anexo_{ATRIBUTO-DATA-CONF}">Anexar documento (PDF, DOC, etc.)</label>
                            <input type="file" class="form-control-file input-anexo" 
                                id="anexo_{ATRIBUTO-DATA-CONF}" 
                                name="anexo">
                        </div>

                        <div class="opcoes-envio {OCULTAR-TODOS-CONFIRMACAO}" id="requer_confirmacao">
                            <strong>Escolha como deseja realizar o envio das instruções:</strong>
                            
                            <div class="custom-control custom-radio radio-todos-confirmados mt-2">
                                <input type="radio" id="{ATRIBUTO-DATA-CONF}_1" name="opcao_envio" value="todos_confirmados" class="custom-control-input">
                                <label class="custom-control-label" for="{ATRIBUTO-DATA-CONF}_1">
                                    <strong>Enviar a todos com presença confirmada</strong>
                                    <p>(Serão enviadas instruções para todos os participantes com presença confirmada que ainda não receberam o e-mail de instruções.)</p>
                                </label>
                            </div>

                            <div class="custom-control custom-radio radio-selecionados">
                                <input type="radio" id="{ATRIBUTO-DATA-CONF}_2" name="opcao_envio" value="selecionados" class="custom-control-input">
                                <label class="custom-control-label" for="{ATRIBUTO-DATA-CONF}_2">
                                    <strong>Enviar somente aos participantes selecionados</strong>
                                    <p>(Serão enviadas instruções a todos os participantes selecionados, independentemente da confirmação de presença e de já terem recebido o e-mail de instruções anteriormente.)</p>
                                </label>
                            </div>

                            <div class="custom-control custom-radio radio-geral">
                                <input type="radio" id="{ATRIBUTO-DATA-CONF}_3" name="opcao_envio" value="geral" class="custom-control-input">
                                <label class="custom-control-label" for="{ATRIBUTO-DATA-CONF}_3">
                                    <strong>Reenviar instruções a todos os participantes</strong>
                                    <p>(Serão enviadas instruções para todos os participantes, inclusive para aqueles que já receberam o e-mail anteriormente, independentemente de terem confirmado presença.)</p>
                                </label>
                            </div>
                        </div>

                        <div class="opcoes-envio {OCULTAR-TODOS}" id="nao_requer_confirmacao">
                            <strong>Escolha como deseja realizar o envio das instruções:</strong>

                            <div class="custom-control custom-radio radio-todos-confirmados mt-2">
                                <input type="radio" id="{ATRIBUTO-DATA-CONF}_1" name="opcao_envio" value="todos_nao_notificados" class="custom-control-input">
                                <label class="custom-control-label" for="{ATRIBUTO-DATA-CONF}_1">
                                    <strong>Enviar a todos os participantes</strong>
                                    <p>(Serão enviadas instruções para todos os participantes que ainda não receberam o e-mail de instruções.)</p>
                                </label>
                            </div>

                            <div class="custom-control custom-radio radio-selecionados">
                                <input type="radio" id="{ATRIBUTO-DATA-CONF}_2" name="opcao_envio" value="selecionados" class="custom-control-input">
                                <label class="custom-control-label" for="{ATRIBUTO-DATA-CONF}_2">
                                    <strong>Enviar somente aos participantes selecionados</strong>
                                    <p>(Serão enviadas instruções a todos os participantes selecionados, independentemente de já terem recebido o e-mail de instruções anteriormente.)</p>
                                </label>
                            </div>

                            <div class="custom-control custom-radio radio-geral">
                                <input type="radio" id="{ATRIBUTO-DATA-CONF}_3" name="opcao_envio" value="geral" class="custom-control-input">
                                <label class="custom-control-label" for="{ATRIBUTO-DATA-CONF}_3">
                                    <strong>Reenviar instruções a todos os participantes</strong>
                                    <p>(Serão enviadas instruções para todos os participantes, inclusive para aqueles que já receberam o e-mail anteriormente.)</p>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary btn-enviar">Enviar</button>
                    </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="row"><div class="col">{LEGENDAS}</div></div>
    <div id="sorteados_data_{ATRIBUTO-DATA-CONF}">
        <div class="table-responsive">
            <table class="table tabela-lista-sorteados">
                <thead>
                <tr>
                    <th style="width: 1%;"><input type="checkbox" class="check-sorteados check-all" name="marcar-todos"></th>
                    <th style="width:25%">Nome Completo</th>
                    <th>E-mails</th>
                    <th>Telefones</th>
                    <th>CPF</th>
                    <th>DRE/SME - UE/Setor</th>
                    <th>Opções</th>
                </tr>
                </thead>
                <tbody>
                {CONTEUDO-TAB}
                </tbody>
            </table>
        </div>
    </div>
</div>
